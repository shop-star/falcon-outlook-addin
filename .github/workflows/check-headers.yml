name: Check headers

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live taskpane.html and check for the current cache-bust SHA
        run: |
          echo "-- current commit SHA --"
          echo "$GITHUB_SHA"
          echo "-- live taskpane.html --"
          curl -sS "https://shop-star.github.io/falcon-outlook-addin/taskpane.html?nocache=$(date +%s)" -H "Cache-Control: no-cache" | grep -o 'taskpane.js?v=[a-f0-9]*'
          echo "-- live viewer.html (via the SHA taskpane.html points to) --"
          SHA=$(curl -sS "https://shop-star.github.io/falcon-outlook-addin/taskpane.html?nocache=$(date +%s)" -H "Cache-Control: no-cache" | grep -o 'taskpane.js?v=[a-f0-9]*' | cut -d= -f2)
          echo "SHA baked into live taskpane.html: $SHA"
          echo "-- live viewer.js (grep for the receivedCount fix) --"
          curl -sS "https://shop-star.github.io/falcon-outlook-addin/viewer.js?nocache=$(date +%s)" -H "Cache-Control: no-cache" | grep -c "receivedCount" || echo "0 (FIX NOT PRESENT)"
          echo "-- live viewer.js CHUNK_SIZE-relevant lines --"
          curl -sS "https://shop-star.github.io/falcon-outlook-addin/taskpane.js?nocache=$(date +%s)" -H "Cache-Control: no-cache" | grep -n "CHUNK_SIZE"
          echo "-- response headers for taskpane.html --"
          curl -sI "https://shop-star.github.io/falcon-outlook-addin/taskpane.html"
