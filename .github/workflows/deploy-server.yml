name: Deploy backend to Azure

# Deploys server/ to the Azure App Service named in the repository variable
# AZURE_WEBAPP_NAME, using the publish profile stored in the secret
# AZURE_WEBAPP_PUBLISH_PROFILE. See the README's "Run the backend" section.

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip quietly until Azure is set up, rather than failing every push.
    if: vars.AZURE_WEBAPP_NAME != ''
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Test
        run: |
          npm ci
          npm test

      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: server
