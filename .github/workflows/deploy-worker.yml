name: Deploy backend to Cloudflare

# Deploys server/ as the "fergus-job" Cloudflare Worker: runs the tests,
# applies any new D1 migrations, then deploys. Needs the repository secret
# CLOUDFLARE_API_TOKEN (see the README's "Run the backend" section); the
# account ID is in server/wrangler.jsonc.

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Check for Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret, then re-run this workflow."
          exit 1

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fergus-job --remote

      - name: Deploy
        run: npx wrangler deploy
