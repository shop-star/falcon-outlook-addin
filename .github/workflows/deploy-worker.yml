name: Deploy backend to Cloudflare

# Deploys server/ as the "fergus-job" Cloudflare Worker: runs the tests,
# applies any new D1 migrations, then deploys. Needs the repository
# variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN (see the
# README's "Run the backend" section); skips quietly until they're set.

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fergus-job --remote

      - name: Deploy
        run: npx wrangler deploy
