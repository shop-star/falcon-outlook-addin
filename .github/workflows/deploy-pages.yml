name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site/assets _site/vendor/pdfjs
          cp manifest.xml taskpane.html taskpane.css taskpane.js _site/
          cp assets/*.png _site/assets/
          cp vendor/pdfjs/*.js _site/vendor/pdfjs/
          # Outlook's own add-in cache (separate from normal HTTP caching)
          # can hang onto old taskpane.js/css/pdf.js well past a reload, so
          # every deploy gets a distinct query string on these references —
          # forces a fresh fetch instead of silently reusing a stale copy.
          sed -i "s/__CACHEBUST__/${GITHUB_SHA}/g" _site/taskpane.html _site/taskpane.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
