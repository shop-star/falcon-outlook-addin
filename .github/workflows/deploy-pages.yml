name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          # Only the add-in's static files: server/ is deployed separately
          # (it holds secrets and runs Node), and the Surface Takeoff app
          # now lives in its own repo (shop-star/surface-takeoff).
          mkdir -p _site/assets _site/taskpane _site/vendor/msal-browser
          cp manifest.xml commands.html commands.js _site/
          cp assets/*.png _site/assets/
          cp taskpane/fergus.html taskpane/fergus.css taskpane/fergus.js taskpane/config.js _site/taskpane/
          cp vendor/msal-browser/* _site/vendor/msal-browser/
          # Outlook's own add-in cache (separate from normal HTTP caching)
          # can hang onto old JS/CSS well past a reload, so every deploy
          # gets a distinct query string on these references — forces a
          # fresh fetch instead of silently reusing a stale copy.
          sed -i "s/__CACHEBUST__/${GITHUB_SHA}/g" _site/commands.html _site/commands.js \
            _site/taskpane/fergus.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
